[package]
name = "indra"
version = "0.3.0"
edition = "2021"
rust-version = "1.89"
description = "One CLI for AI agent harnesses: graph memory (Markdown notes with typed links, Obsidian-compatible) and a local web console to view, monitor and run agents."
license = "MIT"
repository = "https://github.com/dmdhrumilmistry/indra"
readme = "README.md"
keywords = ["ai-agents", "knowledge-graph", "memory", "obsidian", "claude-code"]
categories = ["command-line-utilities", "development-tools"]

[dependencies]
axum = { version = "0.8", features = ["ws"] }
chacha20poly1305 = { version = "0.10", default-features = false, features = ["alloc"] }
clap = { version = "4.5", features = ["derive", "env"] }
futures-util = { version = "0.3", default-features = false, features = ["sink"] }
getrandom = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "process", "io-util", "io-std", "sync", "time", "net", "signal", "fs"] }
toml = "1"
toml_edit = { version = "0.25", default-features = false, features = ["parse", "display"] }
tokio-tungstenite = { version = "0.29", features = ["rustls-tls-webpki-roots"] }
webrtc = { version = "0.14", optional = true }
portable-pty = "0.9"
sha2 = "0.10"
fancy-regex = "0.20.2"
regex = "1"
# The model router (src/deck/router.rs): a streaming HTTP client. All of
# these are already in the tree through axum and tokio-tungstenite.
hyper = { version = "1", features = ["client", "http1"] }
hyper-util = { version = "0.1", features = ["tokio"] }
http-body-util = "0.1"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
rustls-pki-types = { version = "1", features = ["std"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12", "logging"] }
webpki-roots = "0.26"
# Console users' passwords (src/deck/users.rs); salts come from getrandom.
argon2 = { version = "0.5", default-features = false, features = ["alloc", "password-hash"] }

[features]
default = ["webrtc"]
# A direct, peer-to-peer data channel between the hub and its nodes. Without
# it, node traffic is relayed over the node's WebSocket to the hub.
webrtc = ["dep:webrtc"]

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
http-body-util = "0.1"
tower = { version = "0.5", features = ["util"] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
panic = "abort"
