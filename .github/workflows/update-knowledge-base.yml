name: Update Security Knowledge Base

# STAGE 1 of 2: generate knowledge-base edits and open a PR. Nothing is reviewed
# or merged here.
#
# Once the PR is raised successfully this workflow dispatches
# `kb-review-and-merge.yml` (STAGE 2), which runs the adversarial malicious-input
# reviewer and merges the PR only on an APPROVE verdict.
#
# Agent: pluggable via the `agent` input or the KB_AGENT repo variable. Claude Code
# (subscription auth via CLAUDE_CODE_OAUTH_TOKEN), OpenAI Codex, Gemini CLI, and any
# custom CLI are supported. See .github/actions/ai-agent/action.yml.
#
# Safety model (see .github/kb-update/{trusted-sources,prompt,review-prompt}.md):
#   - Generator: WebFetch restricted to a strict domain allowlist; no shell; no push.
#   - Reviewer (stage 2): no web access; read-only plus one verdict file; fail-closed.

on:
  schedule:
    # "Every alternate day" ~ every 2nd day-of-month at 06:00 UTC.
    # Note: day-of-month stepping resets at month boundaries (e.g. 31 -> 1 is a
    # 1-day gap). This is the standard cron approximation of "every other day".
    - cron: "0 6 */2 * *"
  workflow_dispatch:
    inputs:
      agent:
        description: "Agent that generates the KB edits"
        required: false
        default: "claude"
        type: choice
        options: [claude, codex, gemini, custom]
      model:
        description: "Model override for the generator (blank = agent default)"
        required: false
        default: ""
        type: string

# Least privilege: push the PR branch, open/label the PR, mint an OIDC token for
# claude-code-action, and dispatch the stage-2 workflow (`actions: write`).
# This workflow never writes to `main`.
permissions:
  contents: write
  pull-requests: write
  id-token: write
  actions: write

concurrency:
  group: kb-update
  cancel-in-progress: false

env:
  PR_BRANCH: automated/kb-update

jobs:
  # ---------------------------------------------------------------------------
  # JOB 1 (and only job here): generate edits, open the PR, hand off to stage 2.
  # ---------------------------------------------------------------------------
  create-pr:
    name: Generate KB updates and open PR
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Full history so stage 2 can diff the PR branch against main.
          fetch-depth: 0

      # GENERATOR: the agent edits the KB from trusted sources. No commit, no push.
      - name: Generate knowledge-base updates
        uses: ./.github/actions/ai-agent
        with:
          agent: ${{ inputs.agent || vars.KB_AGENT || 'claude' }}
          model: ${{ inputs.model || vars.KB_MODEL || '' }}
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          openai_api_key: ${{ secrets.OPENAI_API_KEY }}
          gemini_api_key: ${{ secrets.GEMINI_API_KEY }}
          custom_install: ${{ vars.KB_AGENT_INSTALL }}
          custom_command: ${{ vars.KB_AGENT_COMMAND }}
          # A successful run that exceeds the cap is reported as a failure and its
          # edits are discarded (run #5 finished in 67 turns against a cap of 60).
          max_turns: "120"
          # Tool allowlist = the security boundary. No Bash (no shell). WebFetch is
          # scoped to trusted domains ONLY; WebSearch may discover URLs but off-list
          # domains cannot be fetched. Keep this list identical to trusted-sources.md.
          allowed_tools: 'Read,Edit,Write,Glob,Grep,WebSearch,WebFetch(domain:owasp.org),WebFetch(domain:cheatsheetseries.owasp.org),WebFetch(domain:cwe.mitre.org),WebFetch(domain:capec.mitre.org),WebFetch(domain:nvd.nist.gov),WebFetch(domain:csrc.nist.gov),WebFetch(domain:developer.mozilla.org),WebFetch(domain:portswigger.net),WebFetch(domain:googleprojectzero.blogspot.com),WebFetch(domain:github.blog),WebFetch(domain:github.com),WebFetch(domain:raw.githubusercontent.com),WebFetch(domain:hackerone.com)'
          prompt: |
            Read .github/kb-update/prompt.md and follow it exactly, including all of
            its security and prompt-injection rules. Read
            .github/kb-update/trusted-sources.md for the domain allowlist. Make small,
            high-signal, well-sourced improvements to the sh-kb-* knowledge bases and
            write .github/kb-update/last-run-summary.md. Do not commit or push.

      - name: Detect changes
        id: diff
        run: |
          set -euo pipefail
          if [ -n "$(git status --porcelain)" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
            git status --short
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No knowledge-base changes this run."
          fi

      - name: Create pull request
        id: cpr
        if: steps.diff.outputs.changed == 'true'
        uses: peter-evans/create-pull-request@v6
        with:
          branch: ${{ env.PR_BRANCH }}
          base: main
          delete-branch: true
          commit-message: "chore(kb): automated knowledge-base refresh"
          title: "chore(kb): automated security knowledge-base refresh"
          labels: |
            knowledge-base
            automated
            awaiting-review
          body: |
            ## Automated knowledge-base refresh

            Generated by the scheduled **Update Security Knowledge Base** workflow
            (stage 1).

            The **KB Review and Merge** workflow (stage 2) now runs an adversarial
            malicious-input reviewer against this diff. It posts its verdict as a
            comment below, and **auto-merges this PR only on an `APPROVE` verdict**.
            A `REJECT` leaves the PR open and labeled `needs-human-review`.

            Run summary is in `.github/kb-update/last-run-summary.md` in this PR.

      # HANDOFF: trigger stage 2 now that the PR is open. `workflow_dispatch` is one
      # of the two events GITHUB_TOKEN is still allowed to trigger, so this works
      # where a plain `pull_request` trigger would silently never fire for a
      # bot-authored PR.
      - name: Trigger review and merge
        if: steps.diff.outputs.changed == 'true' && steps.cpr.outputs.pull-request-number != ''
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ steps.cpr.outputs.pull-request-number }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          REVIEW_AGENT: ${{ vars.KB_REVIEW_AGENT || inputs.agent || vars.KB_AGENT || 'claude' }}
        run: |
          set -euo pipefail
          echo "PR #$PR opened; dispatching kb-review-and-merge.yml on $DEFAULT_BRANCH."
          gh workflow run kb-review-and-merge.yml \
            --ref "$DEFAULT_BRANCH" \
            -f pr="$PR" \
            -f agent="$REVIEW_AGENT"
          echo "Dispatched. Review and merge is handled by that workflow."

      - name: Summary
        if: always()
        env:
          CHANGED: ${{ steps.diff.outputs.changed }}
          PR: ${{ steps.cpr.outputs.pull-request-number }}
        run: |
          {
            echo "### Stage 1: KB update"
            echo
            if [ "${CHANGED:-false}" != "true" ]; then
              echo "No changes produced this run."
            elif [ -n "${PR:-}" ]; then
              echo "Opened PR #${PR}. Stage 2 (review and merge) dispatched."
            else
              echo "Changes were produced but no PR number was returned."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
