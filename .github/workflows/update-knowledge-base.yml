name: Update Security Knowledge Base

# Runs Claude on a schedule to distill fresh, reputable public security research
# into the sh-kb-* knowledge bases and open a PR for human review.
#
# Safety model (see .github/kb-update/trusted-sources.md and prompt.md):
#   - Claude may only WebFetch a strict domain allowlist (defense against
#     prompt injection). Keep the WebFetch(domain:...) list below in sync with
#     trusted-sources.md.
#   - The agent runs with NO shell (no Bash) and NO push access. It only edits
#     files in the working tree; a separate, deterministic step opens the PR.
#   - Nothing lands on a protected branch automatically — every change is a PR
#     that a maintainer reviews and merges.

on:
  schedule:
    # "Every alternate day" ~ every 2nd day-of-month at 06:00 UTC.
    # Note: day-of-month stepping resets at month boundaries (e.g. 31 -> 1 is a
    # 1-day gap). This is the standard cron approximation of "every other day".
    - cron: "0 6 */2 * *"
  # Allow maintainers to trigger a run on demand.
  workflow_dispatch:

# Least privilege: the job itself needs to read the repo and open PRs.
permissions:
  contents: write
  pull-requests: write

concurrency:
  group: kb-update
  cancel-in-progress: false

jobs:
  update-kb:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run Claude to refresh the knowledge base
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          # The full task + safety rules live in the repo so they are versioned
          # and reviewable. Keep the prompt here minimal and point Claude at them.
          prompt: |
            Read .github/kb-update/prompt.md and follow it exactly, including all of
            its security and prompt-injection rules. Read
            .github/kb-update/trusted-sources.md for the domain allowlist. Make small,
            high-signal, well-sourced improvements to the sh-kb-* knowledge bases and
            write .github/kb-update/last-run-summary.md. Do not commit or push.
          # Tool allowlist = the security boundary.
          #   - No Bash: the agent cannot run shell commands.
          #   - WebFetch is scoped to trusted domains ONLY. WebSearch may surface
          #     other domains for discovery, but they cannot be fetched.
          #   - Keep this domain list identical to trusted-sources.md (one line, no
          #     spaces inside the value so the CLI parses each entry cleanly).
          claude_args: |
            --max-turns 60 --allowedTools "Read,Edit,Write,Glob,Grep,WebSearch,WebFetch(domain:owasp.org),WebFetch(domain:cheatsheetseries.owasp.org),WebFetch(domain:cwe.mitre.org),WebFetch(domain:capec.mitre.org),WebFetch(domain:nvd.nist.gov),WebFetch(domain:csrc.nist.gov),WebFetch(domain:developer.mozilla.org),WebFetch(domain:portswigger.net),WebFetch(domain:googleprojectzero.blogspot.com),WebFetch(domain:github.blog),WebFetch(domain:github.com),WebFetch(domain:raw.githubusercontent.com),WebFetch(domain:hackerone.com)"

      - name: Detect changes
        id: diff
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No knowledge-base changes this run."
          fi

      - name: Open pull request
        if: steps.diff.outputs.changed == 'true'
        uses: peter-evans/create-pull-request@v6
        with:
          branch: automated/kb-update
          base: main
          delete-branch: true
          commit-message: "chore(kb): automated knowledge-base refresh"
          title: "chore(kb): automated security knowledge-base refresh"
          labels: |
            knowledge-base
            automated
            needs-review
          body: |
            ## Automated knowledge-base refresh

            This PR was generated by the scheduled **Update Security Knowledge Base**
            workflow. Claude distilled fresh public security research into the
            `sh-kb-*` knowledge bases.

            **Please review carefully before merging.** Fetched web content is treated
            as untrusted data, but a human should still confirm the changes are
            accurate, in-scope, and free of anything injected by a source page — pay
            closest attention to anything sourced from HackerOne (Tier 4).

            See the run summary below (also committed as
            `.github/kb-update/last-run-summary.md`).

            ---

            <details>
            <summary>Sources are restricted to a trusted domain allowlist</summary>

            The updater can only fetch from the domains in
            `.github/kb-update/trusted-sources.md`, has no shell access, and cannot
            push — every change comes through this PR for review.
            </details>
