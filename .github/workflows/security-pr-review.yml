name: Security PR Review

# Runs the sh-pr-review skill on every pull request, posts the findings as inline
# review comments on the PR, and sets the `security/pr-review` commit status.
#
# The status is what branch protection can enforce. Until it is made a required
# check it is advisory: the job reports, nothing is blocked. See "Enforcing the
# check on a repository" in plugins/security-harness/references/pr-review-mapping.md.
#
# Scope: this workflow writes to the pull request and to the commit status. It
# opens no issues and creates nothing in any external tracker.

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read # read the diff
  pull-requests: write # post the review
  statuses: write # set security/pr-review
  id-token: write # required by anthropics/claude-code-action

concurrency:
  # A new push supersedes the in-flight review. Without this, two reviews of
  # different commits race and the loser overwrites the winner's status with a
  # verdict for a stale SHA.
  group: sh-pr-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    name: Security review
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Fork PRs get a read-only token, so the review could never post and the
    # status could never be set. Skip rather than fail and leave a red cross on
    # a contributor's first PR.
    if: github.event.pull_request.head.repo.full_name == github.repository
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # The skill diffs against the PR's real merge-base, which needs history.
          fetch-depth: 0

      - name: Run PR security review
        id: agent
        uses: ./.github/actions/ai-agent
        with:
          agent: ${{ vars.PR_REVIEW_AGENT || 'claude' }}
          # Without this the action swaps its OIDC token for a Claude App token,
          # and that exchange refuses to mint one while the calling workflow is
          # new or modified in the PR under review. The job then exits as a
          # no-op success, which is worse than failing. The permissions block
          # above already grants exactly what the review needs.
          github_token: ${{ secrets.GITHUB_TOKEN }}
          model: ${{ vars.PR_REVIEW_MODEL || '' }}
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          openai_api_key: ${{ secrets.OPENAI_API_KEY }}
          gemini_api_key: ${{ secrets.GEMINI_API_KEY }}
          custom_install: ${{ vars.PR_REVIEW_AGENT_INSTALL }}
          custom_command: ${{ vars.PR_REVIEW_AGENT_COMMAND }}
          max_turns: "80"
          # Bash and gh are needed to fetch the diff, post the review, and set the
          # status. No WebFetch and no WebSearch: this skill reads the diff and the
          # repo, and has no reason to reach the network.
          allowed_tools: "Read,Write,Edit,Glob,Grep,Bash,Task,Skill"
          prompt: |
            Run the sh-pr-review skill on pull request #${{ github.event.pull_request.number }}
            in ${{ github.repository }}.

            Read plugins/security-harness/skills/sh-pr-review/SKILL.md and follow it
            exactly, including plugins/security-harness/references/pr-review-mapping.md
            which it names as authoritative.

            Run with --ci and --fail-on=${{ vars.PR_REVIEW_FAIL_ON || 'high' }}.
            SH_PR_REVIEW_AUTOPOST is set in the environment, so post without prompting.

            Post the result to the pull request itself as one review (event COMMENT)
            and set the security/pr-review commit status against the head SHA. Do not
            open issues and do not create tickets or tasks anywhere else.
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # The double opt-in that lets the skill post without a confirmation
          # prompt. Both this and --ci are required; either alone falls back to
          # the gate, and the job would then wait for input it cannot get.
          SH_PR_REVIEW_AUTOPOST: "1"

      # The transcript is the only way to tell a review that found nothing from
      # one that silently stopped before posting. Uploaded as an artifact rather
      # than printed: it holds every tool result, and Actions logs on a public
      # repo are world-readable.
      - name: Upload agent transcript
        if: always() && steps.agent.outputs.execution_file != ''
        uses: actions/upload-artifact@v4
        with:
          name: pr-review-transcript-${{ github.event.pull_request.number }}-${{ github.run_id }}
          path: ${{ steps.agent.outputs.execution_file }}
          retention-days: 7
          if-no-files-found: warn

      # The skill owns the status on every normal path. This backstop covers the
      # two cases it cannot:
      #
      #   1. The job dies (timeout, cancellation, crashed runner) after the skill
      #      set `pending`.
      #   2. The agent step exits as a no-op *success* without ever running, and
      #      the job goes green having set no status at all. claude-code-action
      #      does exactly this when it cannot mint an App token, which happens
      #      while this workflow file is itself new or modified in the PR under
      #      review. Passing github_token above avoids that path, but a green job
      #      with a silently missing required check is bad enough to guard twice.
      #
      # Hence `always()` and a check for `none` as well as `pending`. A required
      # check that never reports is indistinguishable from a hang and gets the
      # rule deleted, which is the failure mode worth the most paranoia.
      - name: Fail safe the commit status
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SHA: ${{ github.event.pull_request.head.sha }}
          JOB_STATUS: ${{ job.status }}
        run: |
          set -euo pipefail
          STATE="$(gh api "repos/${{ github.repository }}/commits/$SHA/statuses" \
            --jq '[.[] | select(.context == "security/pr-review")][0].state // "none"')"
          echo "Job status: $JOB_STATUS | security/pr-review state: $STATE"

          if [ "$STATE" != "pending" ] && [ "$STATE" != "none" ]; then
            echo "Status is already terminal ($STATE). Leaving it alone."
            exit 0
          fi

          # Distinguish the two shapes of "green job, no status". If `pending`
          # is present the agent reached Phase 0 and stopped somewhere after it;
          # if nothing is there at all it never started. Saying "skipped" for
          # both is what made the first diagnosis of this wrong.
          if [ "$JOB_STATUS" != "success" ]; then
            DESC='Review did not complete: the workflow job failed. Re-run before merging.'
          elif [ "$STATE" = "pending" ]; then
            DESC='Review started but did not post a verdict. See the run transcript artifact.'
          else
            DESC='Review did not run: the agent step never started. Re-run before merging.'
          fi

          gh api "repos/${{ github.repository }}/statuses/$SHA" --method POST \
            -f state=error -f context=security/pr-review \
            -f description="$DESC" \
            -f target_url="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          echo "Set security/pr-review to error: $DESC"
